name: Build Groove Grabber

# Builds the plug-in (VST3 / AU / Standalone, + LV2 on Linux) for macOS, Windows and Linux,
# runs the tests, and makes installers:
#   macOS   -> Groove-Grabber-<version>-macOS.pkg   (universal: Apple Silicon + Intel)
#   Windows -> Groove-Grabber-<version>-Windows-Setup.exe
#   Linux   -> Groove-Grabber-<version>-Linux.tar.gz
# To publish them as a GitHub Release, push a tag like v1.0.0 or put [release] in the commit message;
# the release is named after the version in CMakeLists.txt.

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  macos:
    name: macOS (universal)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 4 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        shell: bash
        run: |
          grep -E "error( |:)|error C[0-9]|error LNK|undefined reference|Undefined symbols|ld: " build.log \
            | grep -v "warning" | head -25 | while IFS= read -r line; do echo "::error::${line:0:1000}"; done || true

      - name: Test
        run: ./build/GGTests_artefacts/${{ env.BUILD_TYPE }}/GGTests --engine

      - name: Ad-hoc sign bundles
        run: |
          ART="build/GrooveGrabber_artefacts/${{ env.BUILD_TYPE }}"
          codesign --force --deep -s - "$ART/AU/Groove Grabber.component"
          codesign --force --deep -s - "$ART/VST3/Groove Grabber.vst3"
          codesign --force --deep -s - "$ART/Standalone/Groove Grabber.app"

      - name: Validate Audio Unit (auval)
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/GrooveGrabber_artefacts/${{ env.BUILD_TYPE }}/AU/Groove Grabber.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu GrG1 Grbr

      - name: Build installer
        run: bash packaging/mac/build_pkg.sh "build/GrooveGrabber_artefacts/${{ env.BUILD_TYPE }}" dist

      - uses: actions/upload-artifact@v4
        with:
          name: Groove-Grabber-macOS
          path: dist/*

  windows:
    name: Windows (x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 4 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        shell: bash
        run: |
          grep -E "error( |:)|error C[0-9]|error LNK|undefined reference|Undefined symbols|ld: " build.log \
            | grep -v "warning" | head -25 | while IFS= read -r line; do echo "::error::${line:0:1000}"; done || true

      - name: Test
        run: build\GGTests_artefacts\${{ env.BUILD_TYPE }}\GGTests.exe --engine

      - name: Load the VST3 like a DAW (scan, play, state, window, close)
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./build/GGTests_artefacts/${{ env.BUILD_TYPE }}/GGTests.exe --host "build/GrooveGrabber_artefacts/${{ env.BUILD_TYPE }}/VST3/Groove Grabber.vst3" 2>&1 | tee host.log
          grep -E "FAIL|PROBLEMS" host.log | while IFS= read -r line; do echo "::error::${line:0:900}"; done || true
          echo "::notice::$(grep -E 'name:|created in|deleted in|loads, plays|unloaded' host.log | tr '\n' ' ' | cut -c1-900)"


      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(GrooveGrabber VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          iscc /DAppVersion=$version /DArtefacts="$PWD\build\GrooveGrabber_artefacts\${{ env.BUILD_TYPE }}" /O"$PWD\dist" packaging\windows\GrooveGrabber.iss
          Compress-Archive -Path "build\GrooveGrabber_artefacts\${{ env.BUILD_TYPE }}\VST3\Groove Grabber.vst3", "build\GrooveGrabber_artefacts\${{ env.BUILD_TYPE }}\Standalone\Groove Grabber.exe" -DestinationPath "dist\Groove-Grabber-$version-Windows-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Groove-Grabber-Windows
          path: dist/*

  linux:
    name: Linux (x64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev libx11-dev libxext-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev xvfb

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel 4 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        shell: bash
        run: |
          grep -E "error( |:)|error C[0-9]|error LNK|undefined reference|Undefined symbols|ld: " build.log \
            | grep -v "warning" | head -25 | while IFS= read -r line; do echo "::error::${line:0:1000}"; done || true

      - name: Test (engine + screenshots)
        run: xvfb-run -a -s "-screen 0 1920x1200x24" ./build/GGTests_artefacts/${{ env.BUILD_TYPE }}/GGTests --shots screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: Groove-Grabber-screenshots
          path: screenshots/*

      - name: Package
        run: |
          VERSION=$(grep -oP 'project\(GrooveGrabber VERSION \K[0-9.]+' CMakeLists.txt)
          ART="build/GrooveGrabber_artefacts/${{ env.BUILD_TYPE }}"
          mkdir -p dist stage
          cp -R "$ART/VST3/Groove Grabber.vst3" "$ART/LV2/Groove Grabber.lv2" "$ART/Standalone/Groove Grabber" stage/
          cp packaging/linux/install.sh stage/
          tar -C stage -czf "dist/Groove-Grabber-$VERSION-Linux.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: Groove-Grabber-Linux
          path: dist/*

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
    needs: [ macos, windows, linux ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "tag=v$(grep -oP 'project\(GrooveGrabber VERSION \K[0-9.]+' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: Groove-Grabber-[MWL]*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          name: Groove Grabber ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          make_latest: true
          body: |
            **Windows:** download `Groove-Grabber-*-Windows-Setup.exe` (VST3 + app).
            **Mac:** download `Groove-Grabber-*-macOS.pkg` (AU + VST3 + app, Apple Silicon and Intel).
            **Linux:** `Groove-Grabber-*-Linux.tar.gz`, then run `./install.sh`.

            After installing, rescan plug-ins in your DAW. Groove Grabber is an instrument: put it on an instrument track.
            First time: open the LIBRARY page and add the folders where your drum kits and one shots live.
